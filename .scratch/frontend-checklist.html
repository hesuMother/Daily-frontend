<title>D.aily 프론트 체크리스트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F5F1;
  --surface:#FFFFFF;
  --surface-alt:#EBEDE7;
  --border:#DBDFD5;
  --text:#181B15;
  --text-muted:#666F60;
  --accent:#2F6F5E;
  --accent-soft:#DCEAE4;
  --critical:#B5432B;
  --critical-soft:#F5DFD8;
  --recommend:#93711C;
  --recommend-soft:#F1E6C9;
  --optional:#57606B;
  --optional-soft:#E4E7EB;
  --shadow: 0 1px 2px rgba(20,24,16,0.05), 0 8px 24px -12px rgba(20,24,16,0.12);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14160F;
    --surface:#1D2018;
    --surface-alt:#242820;
    --border:#333827;
    --text:#EEF0E6;
    --text-muted:#9BA391;
    --accent:#6FBFA3;
    --accent-soft:#22352C;
    --critical:#E08165;
    --critical-soft:#3A241D;
    --recommend:#D8B85A;
    --recommend-soft:#3A2F17;
    --optional:#A6AEB8;
    --optional-soft:#282C31;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -12px rgba(0,0,0,0.5);
  }
}
:root[data-theme="dark"]{
  --bg:#14160F;
  --surface:#1D2018;
  --surface-alt:#242820;
  --border:#333827;
  --text:#EEF0E6;
  --text-muted:#9BA391;
  --accent:#6FBFA3;
  --accent-soft:#22352C;
  --critical:#E08165;
  --critical-soft:#3A241D;
  --recommend:#D8B85A;
  --recommend-soft:#3A2F17;
  --optional:#A6AEB8;
  --optional-soft:#282C31;
  --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -12px rgba(0,0,0,0.5);
}

@font-face{
  font-family:'Fraunces';
  src:local('Fraunces');
}
* { box-sizing:border-box; }
body{
  background:var(--bg);
  color:var(--text);
  font-family:'IBM Plex Sans','IBM Plex Sans KR',-apple-system,sans-serif;
  padding-inline:16px;
  padding-block:28px 60px;
}
.wrap{ max-width:760px; margin:0 auto; }

.masthead{
  margin-bottom:22px;
}
.eyebrow{
  font-family:'IBM Plex Mono',monospace;
  font-size:11px;
  letter-spacing:0.18em;
  text-transform:uppercase;
  color:var(--accent);
  margin:0 0 10px;
}
h1{
  font-family:'Fraunces',Georgia,serif;
  font-weight:600;
  font-size:clamp(26px,5vw,34px);
  line-height:1.15;
  margin:0 0 10px;
  text-wrap:balance;
}
.sub{
  color:var(--text-muted);
  font-size:13.5px;
  line-height:1.6;
  margin:0;
  max-width:56ch;
}
.sub code{
  font-family:'IBM Plex Mono',monospace;
  font-size:12px;
  background:var(--surface-alt);
  padding:1px 5px;
  border-radius:3px;
  border:1px solid var(--border);
}

.progress-card{
  position:sticky;
  top:env(safe-area-inset-top,0px);
  z-index:5;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:10px;
  box-shadow:var(--shadow);
  padding:14px 16px;
  margin-bottom:22px;
}
.progress-top{
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  gap:10px;
  margin-bottom:9px;
}
.progress-label{
  font-size:13px;
  font-weight:600;
}
.progress-count{
  font-family:'IBM Plex Mono',monospace;
  font-size:12px;
  color:var(--text-muted);
  font-variant-numeric:tabular-nums;
}
.bar-track{
  height:7px;
  background:var(--surface-alt);
  border-radius:99px;
  overflow:hidden;
}
.bar-fill{
  height:100%;
  background:var(--accent);
  border-radius:99px;
  transition:width .25s ease;
  width:0%;
}

.filters{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
  margin-bottom:22px;
}
.chip{
  font-family:'IBM Plex Mono',monospace;
  font-size:11px;
  letter-spacing:0.03em;
  padding:6px 11px;
  border-radius:99px;
  border:1px solid var(--border);
  background:var(--surface);
  color:var(--text-muted);
  cursor:pointer;
  transition:background .15s, color .15s, border-color .15s;
}
.chip:hover{ border-color:var(--accent); color:var(--text); }
.chip[aria-pressed="true"]{
  background:var(--text);
  color:var(--bg);
  border-color:var(--text);
}

section.group{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:12px;
  box-shadow:var(--shadow);
  margin-bottom:16px;
  overflow:hidden;
}
.group-head{
  display:flex;
  align-items:baseline;
  gap:12px;
  padding:16px 18px 14px;
  border-bottom:1px solid var(--border);
}
.group-num{
  font-family:'IBM Plex Mono',monospace;
  font-size:12px;
  color:var(--accent);
  min-width:20px;
}
.group-title{
  font-family:'Fraunces',Georgia,serif;
  font-weight:600;
  font-size:17px;
  margin:0;
  flex:1;
}
.group-note{
  font-size:11.5px;
  color:var(--text-muted);
  font-family:'IBM Plex Mono',monospace;
}

.item{
  display:flex;
  gap:12px;
  padding:13px 18px;
  border-bottom:1px solid var(--border);
  align-items:flex-start;
}
.item:last-child{ border-bottom:none; }
.item.is-done{ background:var(--surface-alt); }
.item.is-hidden{ display:none; }

.cb{
  appearance:none;
  -webkit-appearance:none;
  width:18px;
  height:18px;
  min-width:18px;
  margin-top:2px;
  border:1.5px solid var(--border);
  border-radius:5px;
  background:var(--surface);
  cursor:pointer;
  position:relative;
  transition:background .15s, border-color .15s;
}
.cb:checked{
  background:var(--accent);
  border-color:var(--accent);
}
.cb:checked::after{
  content:"";
  position:absolute;
  left:5px; top:1px;
  width:5px; height:9px;
  border:solid white;
  border-width:0 2px 2px 0;
  transform:rotate(40deg);
}
.cb:focus-visible{
  outline:2px solid var(--accent);
  outline-offset:2px;
}

.item-body{ flex:1; min-width:0; }
.item-top{
  display:flex;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
  margin-bottom:3px;
}
label.item-title{
  font-size:14px;
  font-weight:600;
  cursor:pointer;
  line-height:1.4;
}
.item.is-done label.item-title{
  color:var(--text-muted);
  text-decoration:line-through;
  text-decoration-color:var(--border);
}
.pill{
  font-family:'IBM Plex Mono',monospace;
  font-size:10px;
  letter-spacing:0.04em;
  padding:2px 7px;
  border-radius:99px;
  white-space:nowrap;
}
.pill.crit{ background:var(--critical-soft); color:var(--critical); }
.pill.rec{ background:var(--recommend-soft); color:var(--recommend); }
.pill.opt{ background:var(--optional-soft); color:var(--optional); }

.item-desc{
  font-size:12.5px;
  color:var(--text-muted);
  line-height:1.55;
  margin:0;
}
.item-desc code{
  font-family:'IBM Plex Mono',monospace;
  font-size:11.5px;
  background:var(--surface-alt);
  padding:1px 4px;
  border-radius:3px;
  border:1px solid var(--border);
}

.legend{
  display:flex;
  gap:14px;
  flex-wrap:wrap;
  font-size:11px;
  color:var(--text-muted);
  margin:6px 0 24px;
}
.legend span{ display:inline-flex; align-items:center; gap:5px; }
.dot{ width:7px; height:7px; border-radius:50%; }

.reset-row{
  text-align:center;
  margin-top:8px;
}
.reset-btn{
  font-family:'IBM Plex Mono',monospace;
  font-size:11px;
  color:var(--text-muted);
  background:none;
  border:1px solid var(--border);
  border-radius:8px;
  padding:8px 14px;
  cursor:pointer;
}
.reset-btn:hover{ border-color:var(--critical); color:var(--critical); }
</style>

<div class="wrap">
  <div class="masthead">
    <p class="eyebrow">D.aily · Frontend Readiness</p>
    <h1>화면은 다 그렸고, 이제 뭘 붙여야 할까</h1>
    <p class="sub">
      <code>src/app/App.tsx</code> 기준으로 실제 코드를 훑어보고 만든 체크리스트예요.
      화면 UI(shadcn 컴포넌트, 9개 상품 카드, 로그인 모달 등)는 이미 갖춰져 있고,
      지금부터는 "진짜로 동작하게 만드는" 단계예요.
    </p>
  </div>

  <div class="progress-card">
    <div class="progress-top">
      <span class="progress-label">전체 진행률</span>
      <span class="progress-count"><span id="doneCount">0</span> / <span id="totalCount">0</span></span>
    </div>
    <div class="bar-track"><div class="bar-fill" id="barFill"></div></div>
  </div>

  <div class="filters" role="group" aria-label="필터">
    <button class="chip" data-filter="all" aria-pressed="true">전체</button>
    <button class="chip" data-filter="crit">필수만</button>
    <button class="chip" data-filter="rec">권장만</button>
    <button class="chip" data-filter="opt">선택만</button>
    <button class="chip" data-filter="undone">미완료만</button>
  </div>

  <div class="legend">
    <span><span class="dot" style="background:var(--critical)"></span>필수 — 지금 상태로는 서비스로 못 쓰는 항목</span>
    <span><span class="dot" style="background:var(--recommend)"></span>권장 — 없어도 돌아가지만 곧 문제될 항목</span>
    <span><span class="dot" style="background:var(--optional)"></span>선택 — 여유 있을 때</span>
  </div>

  <div id="groups"></div>

  <div class="reset-row">
    <button class="reset-btn" id="resetBtn">체크 상태 초기화</button>
  </div>
</div>

<script>
const DATA = [
  {
    title: "프로젝트 기반 정리",
    note: "먼저 할 일",
    items: [
      { p:"crit", t:"Git 저장소 초기화 + 원격 저장소 연결", d:"현재 이 프로젝트는 git 저장소가 아니에요. 버전 관리 없이 작업 중이면 실수로 코드를 날려도 되돌릴 방법이 없어요. <code>git init</code>부터." },
      { p:"rec", t:"중복된 App.tsx 정리", d:"루트의 <code>src/App.tsx</code>는 안 쓰이는 파일이고, 실제로는 <code>src/app/App.tsx</code>가 <code>main.tsx</code>에서 import돼요. 헷갈리기 전에 죽은 파일 삭제." },
      { p:"rec", t:".env 환경변수 구조 설계", d:"API_BASE_URL, 이미지 CDN 도메인 등을 코드에 박아넣지 않고 환경변수로 분리할 준비." },
    ]
  },
  {
    title: "목업 데이터 → 실제 데이터",
    note: "핵심",
    items: [
      { p:"crit", t:"상품/배너/스타일 데이터 API 연동", d:"지금은 <code>App.tsx</code>에 상품 9개, 배너, 카테고리가 전부 하드코딩된 배열이에요. 최저가 비교·가격 추이 같은 핵심 기능이 실 데이터 없이는 의미가 없어요." },
      { p:"rec", t:"로딩 상태 UI 적용", d:"<code>shared/components/ui/skeleton.tsx</code>가 이미 있는데 실제로 쓰이는 곳이 안 보여요. 데이터 fetch 붙이기 전에 로딩 스켈레톤부터 각 페이지에 배치." },
      { p:"rec", t:"에러 · 빈 상태(empty state) UI", d:"검색 결과 0건, API 실패, 위시리스트 비어있음 같은 케이스의 화면이 아직 설계 안 돼 있어요." },
      { p:"opt", t:"플레이스홀더 이미지 → 실제 자산으로 교체", d:"현재 전 상품 이미지가 Unsplash 목업 URL이에요. 실제 서비스 이미지 CDN으로 전환 + 포맷 최적화." },
    ]
  },
  {
    title: "라우팅",
    note: "URL이 없다",
    items: [
      { p:"crit", t:"react-router 등 URL 기반 라우팅 도입", d:"지금은 <code>activeCollection</code>, <code>activeStyle</code>, <code>selectedProduct</code> 같은 useState로 '페이지'를 흉내내고 있어요. 상세페이지 URL이 없어서 새로고침하면 홈으로 튕겨요." },
      { p:"crit", t:"공유 가능한 링크 만들기", d:"상품 상세, 검색 결과, 컬렉션 페이지를 링크 하나로 공유할 방법이 현재 없어요. URL 라우팅 도입과 함께 해결돼요." },
      { p:"rec", t:"브라우저 뒤로가기 연동", d:"뒤로가기를 누르면 브라우저 히스토리가 아니라 그냥 브라우저 탭을 벗어나 버려요." },
    ]
  },
  {
    title: "인증 & 사용자 상태",
    note: "지금은 다 가짜",
    items: [
      { p:"crit", t:"실제 인증 로직 연동", d:"<code>LoginModal.tsx</code>는 카카오·구글·애플 버튼까지 있지만 실제로는 아무 데도 요청을 보내지 않는 순수 UI예요. 백엔드 인증(자체 서버 or Firebase/Supabase 등) 연동 필요." },
      { p:"crit", t:"로그인 세션 유지", d:"새로고침하면 <code>isLoggedIn</code>이 초기화돼서 로그아웃 상태로 돌아가요. 토큰/세션 저장이 전혀 없어요." },
      { p:"rec", t:"찜 · 최근 본 상품 영속화", d:"위시리스트와 최근 본 상품도 현재 메모리(state)에만 있어서 새로고침하면 사라져요. 로그인 전엔 localStorage, 로그인 후엔 서버 저장 고려." },
    ]
  },
  {
    title: "반응형 & 접근성",
    note: "",
    items: [
      { p:"rec", t:"실기기 / 여러 뷰포트 검증", d:"현재 레이아웃은 <code>md:</code> 브레이크포인트 위주로 짜여 있어요. 실제 모바일 기기에서 상세페이지, 모달, 검색 오버레이를 직접 확인해보세요." },
      { p:"rec", t:"키보드 내비게이션 · 포커스 점검", d:"로그인 모달은 Esc로 닫히긴 하는데, 포커스 트랩(모달 안에서만 Tab 순환)이 되어 있는지는 확인이 필요해요." },
      { p:"opt", t:"이미지 alt · 버튼 aria-label 전수 점검", d:"아이콘만 있는 버튼(위시리스트 하트, 검색 등)에 스크린리더용 라벨이 빠진 곳이 있을 수 있어요." },
    ]
  },
  {
    title: "성능",
    note: "",
    items: [
      { p:"rec", t:"페이지 단위 코드 스플리팅", d:"현재 모든 페이지 컴포넌트가 App.tsx 하나에서 즉시 import돼요. React.lazy + Suspense로 상세페이지, 마이페이지 등을 분리하면 초기 로딩이 가벼워져요." },
      { p:"opt", t:"이미지 lazy loading", d:"상품 그리드의 <code>&lt;img&gt;</code>에 <code>loading=\"lazy\"</code> 속성이 아직 없어요." },
      { p:"opt", t:"recharts 같은 무거운 라이브러리 dynamic import", d:"가격 추이 차트(recharts)는 상품 상세에서만 쓰이니 해당 페이지 진입 시에만 로드되도록." },
    ]
  },
  {
    title: "코드 품질",
    note: "",
    items: [
      { p:"rec", t:"tsconfig strict 모드 켜기", d:"<code>tsconfig.app.json</code>에 <code>strict: true</code>가 명시돼 있지 않아요. 지금 켜두면 나중에 타입 에러가 눈덩이처럼 불어나는 걸 막을 수 있어요." },
      { p:"rec", t:"App.tsx 관심사 분리", d:"<code>src/app/App.tsx</code>가 900줄 넘게 상품 데이터 + 페이지 라우팅 + 홈 화면 마크업을 다 갖고 있어요. 데이터는 별도 모듈로, 홈 화면은 별도 컴포넌트로 분리 고려." },
      { p:"opt", t:"ESLint 전체 규칙 점검", d:"<code>eslint.config.js</code> 기준으로 <code>npm run lint</code> 한번 돌려서 현재 위반 사항이 없는지 확인." },
    ]
  },
  {
    title: "테스트",
    note: "0에서 시작",
    items: [
      { p:"rec", t:"테스트 프레임워크 세팅", d:"현재 프로젝트에 테스트 파일이 하나도 없어요. Vite 환경이니 Vitest + React Testing Library가 자연스러운 선택이에요." },
      { p:"rec", t:"핵심 플로우 테스트 작성", d:"로그인, 상품 검색, 위시리스트 토글처럼 자주 건드릴 로직부터 테스트를 붙이면 리팩터링할 때 안심이 돼요." },
    ]
  },
  {
    title: "배포",
    note: "",
    items: [
      { p:"crit", t:"프로덕션 환경변수 분리", d:"실 서비스로 나가기 전에 API 주소, 키 값들이 환경별로 분리되어 있어야 해요." },
      { p:"opt", t:"CI/CD 파이프라인 구성", d:"현재 <code>dist</code> 폴더가 있는 걸 보면 로컬 빌드는 되고 있어요. GitHub Actions 등으로 빌드/배포 자동화 고려." },
      { p:"opt", t:"페이지별 SEO 메타 태그", d:"조건부 렌더링 SPA라서 상세페이지든 홈이든 <code>&lt;title&gt;</code>이 다 똑같아요. 라우팅 도입 후 페이지별 메타 태그도 같이 챙기면 좋아요." },
    ]
  },
];

const STORAGE_KEY = "daily-checklist-v1";
let state = {};
try {
  state = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
} catch (e) { state = {}; }

function save() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
}

const groupsEl = document.getElementById("groups");
let idx = 0;
const allCheckboxes = [];

DATA.forEach((group, gi) => {
  const section = document.createElement("section");
  section.className = "group";

  const head = document.createElement("div");
  head.className = "group-head";
  head.innerHTML = `<span class="group-num">${String(gi).padStart(2,"0")}</span><h2 class="group-title">${group.title}</h2>${group.note ? `<span class="group-note">${group.note}</span>` : ""}`;
  section.appendChild(head);

  group.items.forEach((item) => {
    const id = "item-" + (idx++);
    const row = document.createElement("div");
    row.className = "item";
    row.dataset.priority = item.p;

    const pillClass = item.p === "crit" ? "crit" : item.p === "rec" ? "rec" : "opt";
    const pillLabel = item.p === "crit" ? "필수" : item.p === "rec" ? "권장" : "선택";

    row.innerHTML = `
      <input type="checkbox" class="cb" id="${id}">
      <div class="item-body">
        <div class="item-top">
          <label class="item-title" for="${id}">${item.t}</label>
          <span class="pill ${pillClass}">${pillLabel}</span>
        </div>
        <p class="item-desc">${item.d}</p>
      </div>
    `;
    section.appendChild(row);

    const cb = row.querySelector("input");
    cb.checked = !!state[id];
    if (cb.checked) row.classList.add("is-done");
    cb.addEventListener("change", () => {
      state[id] = cb.checked;
      row.classList.toggle("is-done", cb.checked);
      save();
      updateProgress();
      applyFilter();
    });
    allCheckboxes.push({ cb, row });
  });

  groupsEl.appendChild(section);
});

function updateProgress() {
  const total = allCheckboxes.length;
  const done = allCheckboxes.filter(x => x.cb.checked).length;
  document.getElementById("totalCount").textContent = total;
  document.getElementById("doneCount").textContent = done;
  document.getElementById("barFill").style.width = (total ? (done/total*100) : 0) + "%";
}

let currentFilter = "all";
function applyFilter() {
  allCheckboxes.forEach(({ cb, row }) => {
    const p = row.dataset.priority;
    let show = true;
    if (currentFilter === "crit") show = p === "crit";
    else if (currentFilter === "rec") show = p === "rec";
    else if (currentFilter === "opt") show = p === "opt";
    else if (currentFilter === "undone") show = !cb.checked;
    row.classList.toggle("is-hidden", !show);
  });
  document.querySelectorAll(".group").forEach(g => {
    const visible = Array.from(g.querySelectorAll(".item")).some(r => !r.classList.contains("is-hidden"));
    g.style.display = visible ? "" : "none";
  });
}

document.querySelectorAll(".chip").forEach(chip => {
  chip.addEventListener("click", () => {
    document.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed","false"));
    chip.setAttribute("aria-pressed","true");
    currentFilter = chip.dataset.filter;
    applyFilter();
  });
});

document.getElementById("resetBtn").addEventListener("click", () => {
  if (!confirm("체크 상태를 모두 초기화할까요?")) return;
  state = {};
  save();
  allCheckboxes.forEach(({ cb, row }) => { cb.checked = false; row.classList.remove("is-done"); });
  updateProgress();
  applyFilter();
});

updateProgress();
</script>
